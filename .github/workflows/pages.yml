name: CashOS Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install CashOS build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nasm qemu-system-x86 build-essential npm
      - name: Build CashOS
        run: make
      - name: Smoke-test CashOS
        run: make smoke
      - name: Test employee/admin profiles
        run: make profile-test
      - name: Test COM1/ZPL printer path
        run: make printer-test
      - name: Build browser site
        run: make web
      - name: Validate site image
        run: test "$(stat -c %s build/site/register.img)" -eq 1474560
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
